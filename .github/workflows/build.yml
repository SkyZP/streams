name: Build StreamPad EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile jadi .exe portable
        run: |
          python -m PyInstaller --onefile --windowed --name "StreamPad-1.0.0-portable" --icon=assets\icon.ico --add-data "assets\icon.ico;assets" main.py

      - name: Upload hasil .exe
        uses: actions/upload-artifact@v4
        with:
          name: StreamPad-portable-exe
          path: dist/StreamPad-1.0.0-portable.exe
